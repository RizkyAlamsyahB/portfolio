version: '3.8'
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rizky-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
